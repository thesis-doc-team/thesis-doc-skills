<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{TITLE}}｜项目概览</title>
<style>
:root{--ink:#223452;--muted:#60718f;--line:#e2eafa;--blue:#416bd6;--bg:#f5f8ff;--mint:#d9f7e9;--warm:#fff0de}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);line-height:1.75}
.shell{max-width:1030px;margin:auto;padding:28px 20px 65px}.top{display:flex;align-items:center;justify-content:space-between;padding:7px 0 26px;color:#5571af;font-weight:800;font-size:13px}
.tag{font-size:11px;letter-spacing:.12em;color:#4d6ed2;background:#e8efff;padding:5px 12px;border-radius:30px}
.hero{position:relative;overflow:hidden;background:linear-gradient(117deg,#e2ecff,#f9fbff 57%,#e4fbf4);border:1px solid #e0e8fb;border-radius:30px;padding:48px 44px;box-shadow:0 20px 45px #dce6f854}
.hero:after{content:"";position:absolute;width:195px;height:195px;border:22px solid #ffffff7a;right:-60px;top:-100px;border-radius:55px;transform:rotate(-25deg);pointer-events:none}
.kicker{color:#5978d0;font-weight:900;font-size:11px;letter-spacing:2px;margin:0 0 12px}h1{font-size:clamp(26px,4.5vw,42px);letter-spacing:-.03em;line-height:1.35;max-width:750px;margin:0 0 23px;overflow-wrap:anywhere}
.overview{font-size:15px;line-height:2.0;max-width:830px;color:#526786;margin:0;white-space:pre-line;overflow-wrap:anywhere}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:38px 0 20px}.section-head h2{margin:0;font-size:24px;line-height:1.45}.count{color:#5870ab;font-weight:800;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:17px}.feature{position:relative;border:1px solid var(--line);border-radius:20px;background:#fff;min-height:172px;padding:25px;box-shadow:0 8px 18px #dbe5f52d;overflow:hidden}
.feature:before{content:"";width:66px;height:66px;background:#e9f0ff;position:absolute;right:-20px;top:-20px;border-radius:24px;transform:rotate(20deg)}
.feature:nth-child(3n+2):before{background:var(--mint)}.feature:nth-child(3n):before{background:var(--warm)}.feature-n{display:inline-grid;place-items:center;background:#e9efff;color:#4b6fd8;width:36px;height:36px;border-radius:11px;font-weight:900;font-size:13px}
.feature:nth-child(3n+2) .feature-n{background:#e2f7ed;color:#218465}.feature:nth-child(3n) .feature-n{background:#fff0dc;color:#a97937}
.feature h3{font-size:17px;line-height:1.5;margin:17px 0 8px;overflow-wrap:anywhere}.feature p{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere;white-space:pre-line}
footer{color:#96a5bd;text-align:center;font-size:11px;padding-top:35px} @media(max-width:650px){.shell{padding:14px 13px 32px}.hero{padding:33px 24px;border-radius:23px}.grid{grid-template-columns:1fr}.section-head{margin-top:31px}.feature{min-height:0;padding:22px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body><main class="shell">
<div class="top"><span>PROJECT / OVERVIEW</span><span class="tag">项目概览</span></div>
<section class="hero" aria-labelledby="project-title"><p class="kicker">PROJECT INTRODUCTION</p><h1 id="project-title">{{TITLE}}</h1><p class="overview">{{OVERVIEW}}</p></section>
<section aria-labelledby="features-title"><div class="section-head"><h2 id="features-title">核心功能</h2><span class="count">{{FEATURE_COUNT}} 项功能</span></div><div class="grid">{{FEATURES}}</div></section>
<footer>项目概览 · 内容以当前版本为准</footer>
</main></body></html>
